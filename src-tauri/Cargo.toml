[package]
name = "real-sticky"
version = "0.1.3"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tempfile = "3"
tokio = { version = "1", features = ["time"] }
